services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contextflow
      POSTGRES_PASSWORD: contextflow
      POSTGRES_DB: contextflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextflow -d contextflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      # Optional local overrides (do not commit secrets).
      - path: ./apps/api/.env
        required: false
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: contextflow
      DATABASE_PASSWORD: contextflow
      DATABASE_NAME: contextflow
      DATABASE_URL: postgresql+psycopg://contextflow:contextflow@postgres:5432/contextflow
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/repo/apps/web
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
